{% block title %}
products
{% endblock %}
{% block content %}
<h1> Products </h1>
{% for product in products %}
    <h2> {{product.name}}</h2>
     <p> {{product.price }}</p>
      {% if product.is_available %}
        <p> available </p>
      {% else %}
           <p> out of stock </p>
      {% endif %}
{% endfor %}
{% endblock %}
